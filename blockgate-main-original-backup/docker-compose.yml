version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: bitnovaswap_mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bitnova_net

  app:
    build: .
    container_name: bitnovaswap_app
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/bitnovaswap
      - JWT_SECRET=9f7c243949jifdb4d6f0a3c9e7b2d5a8f1c6e4d9b7a2f0c5e8d1
      - SMTP_HOST=smtp.hostinger.com
      - SMTP_SECURE=true
      - SMTP_PORT=465
      - SMTP_USER=legal@bitnovaswap.org
      - SMTP_PASSWORD=tf4v-5vj8-ijvi-l2ai
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - bitnova_net

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  bitnova_net:
    driver: bridge
